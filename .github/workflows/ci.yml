name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 타입 체크
        run: npm run type-check

      - name: 테스트 실행
        run: npm run test

      - name: 빌드
        run: npm run build
