# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 리뷰 코멘트와 대화는 한국어로 작성합니다.
language: ko-KR
tone_instructions: >
  한국어로 친절하고 구체적으로 설명하세요. 주니어 개발자도 이해할 수 있게
  문제의 원인, 영향 범위, 수정 방향을 함께 제시하세요. 단순한 취향 차이는
  지적하지 말고, 확신이 낮은 내용은 추측이라고 명시하세요.
  마크다운으로 가독성 있게 작성하세요.

reviews:
  # 처음에는 균형형으로 시작하고, 지적이 많으면 quiet으로 낮춥니다.
  profile: chill

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    base_branches:
      - develop
      - main
    ignore_title_keywords:
      - WIP
      - "[skip review]"

  path_instructions:
    - path: "src/**"
      instructions: |
        Vue 3 Composition API와 TypeScript 기준으로 리뷰하세요.
        ref/reactive/computed/watch의 반응성 사용, 컴포넌트 생명주기 정리,
        이벤트 핸들러와 비동기 작업의 중복 실행·누수를 확인하세요.
        UI는 시맨틱 HTML, 키보드 접근성, 적절한 aria 속성,
        로딩·빈 상태·에러 상태가 빠짐없이 제공되는지 검토하세요.
        기능의 요구사항과 변경 의도가 실제 구현에 빠짐없이 반영됐는지 확인하세요.
        정상 동작뿐 아니라 API 실패, 네트워크 오류, 빈 데이터, 권한 부족,
        잘못된 입력, 중복 실행, 로딩 중 상태와 재시도 시나리오를 검토하세요.
        비동기 처리의 race condition, 누락된 예외 처리, null·undefined와 경계값,
        사용자에게 노출되는 오류 메시지와 복구 경로를 중점적으로 확인하세요.
        기존 기능의 회귀 가능성과 관련 테스트 누락도 함께 지적하세요.
        다음 보안 항목도 확인하세요: 비밀키·토큰·개인정보의 소스코드/로그/에러 메시지 노출,
        localStorage·URL·쿼리스트링에 민감정보 저장, 사용자 입력을 통한 XSS와 HTML 주입,
        API 요청의 인증·인가 누락, 신뢰할 수 없는 리다이렉트, 민감한 데이터의 과도한 응답 노출,
        클라이언트 값이나 권한 검사를 신뢰하는 로직, 그리고 실패 시 안전하지 않은 기본값.
        보안 지적은 재현 가능한 근거와 영향 범위를 함께 설명하세요.
        단순한 스타일 선호나 린터가 이미 잡는 사소한 문제는 지적하지 마세요.

    - path: "src/**/__tests__/**"
      instructions: |
        Vitest 테스트가 구현 세부사항이 아니라 사용자 observable behavior를 검증하는지 확인하세요.
        성공 케이스만으로 끝나지 않고 API 실패, 빈 데이터, 잘못된 입력,
        중복 실행, 비동기 완료 전후의 상태와 경계값을 다루는지 검토하세요.

    - path: "package.json"
      instructions: |
        의존성 추가·업데이트 시 알려진 취약점, 과도한 권한을 요구하는 패키지,
        유지보수 상태가 불명확한 패키지를 확인하세요.
        테스트 도구, 빌드 플러그인, @types/*처럼 런타임에 필요 없는 라이브러리가
        dependencies가 아닌 devDependencies에 올바르게 분류됐는지도 검토하세요.

    - path: "vite.config.ts"
      instructions: |
        vite-plugin-pwa 설정을 리뷰할 때 manifest의 name, lang, scope, start_url,
        display, theme 색상과 아이콘 경로·사이즈가 실제 앱과 일치하는지 확인하세요.
        서비스 워커의 precache 범위가 빌드 산출물과 일치하는지,
        API 요청이 index.html fallback이나 잘못된 캐시 전략의 영향을 받지 않는지,
        오래된 캐시 정리와 새 버전 업데이트 방식이 사용자 데이터를 손상시키지 않는지 검토하세요.

    - path: "src/**/Pwa*.vue"
      instructions: |
        서비스 워커 등록이 중복되지 않고, 등록 실패·오프라인·업데이트 대기 상태를
        사용자 경험을 해치지 않게 처리하는지 확인하세요.
        새 서비스 워커 적용 시 현재 입력이나 진행 중인 작업을 잃을 가능성,
        업데이트 안내의 접근성과 사용자가 업데이트를 나중에 선택할 수 있는지도 검토하세요.

    - path: "src/**/Pwa*.test.ts"
      instructions: |
        서비스 워커 등록·업데이트 알림·업데이트 적용·나중에 선택하는 흐름과 함께
        등록 실패, 업데이트가 없는 경우, 비동기 업데이트 실패를 검증하는지 확인하세요.
